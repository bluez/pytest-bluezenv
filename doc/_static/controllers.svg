  <title
     id="c-title">btvirt controller bus</title>
  <desc
     id="c-desc">Each VM host has its own controller, reached over HCI by the kernel. By default the controllers are emulated by a single btvirt process, which bridges a virtual air link between them so the hosts see each other.</desc>
  <defs
     id="defs1">
    <marker
       id="arrow"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="7"
       markerHeight="7"
       orient="auto-start-reverse">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#5b6470"
         id="path1" />
    </marker>
    <style
       id="style1">
      .card  { fill:#ffffff; stroke:#d7dbe0; stroke-width:1.5; }
      .grp   { fill:none; stroke:#9aa4b2; stroke-width:1.2; stroke-dasharray:5 4; }
      .cap   { fill:#6b7280; font:600 12px ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif; letter-spacing:.3px; }
      .chip  { fill:#eef1f5; stroke:#c9d3e2; stroke-width:1; }
      .chiptx{ fill:#1f2430; font:600 12.5px ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif; }
      .hctrl { fill:#eef4ff; stroke:#5aa2ff; stroke-width:1.5; }
      .hctltx{ fill:#0b5bd3; font:700 13px ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif; }
      .wire  { stroke:#5b6470; stroke-width:2; fill:none; }
      .wtxt  { fill:#5b6470; font:600 11px ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif; }
      .air   { stroke:#5aa2ff; stroke-width:2; fill:none; stroke-dasharray:4 4; }
      .wave  { stroke:#5aa2ff; stroke-width:2; fill:none; stroke-linecap:round; }
    </style>
  </defs>
  <!-- VM #0 group -->
  <rect
     class="grp"
     x="32"
     y="44"
     width="232"
     height="86"
     rx="12"
     id="rect2" />
  <text
     class="cap"
     x="148"
     y="63"
     text-anchor="middle"
     id="text2">VM HOST #0</text>
  <rect
     class="chip"
     x="46"
     y="74"
     width="88"
     height="42"
     rx="8"
     id="rect3" />
  <text
     class="chiptx"
     x="90"
     y="100"
     text-anchor="middle"
     id="text3">kernel</text>
  <rect
     class="hctrl"
     x="170"
     y="74"
     width="80"
     height="42"
     rx="8"
     id="rect4" />
  <text
     class="hctltx"
     x="210"
     y="100"
     text-anchor="middle"
     id="text4">hci0</text>
  <path
     class="wire"
     d="M 134 95 L 170 95"
     marker-start="url(#arrow)"
     marker-end="url(#arrow)"
     id="path4" />
  <!-- btvirt in the middle -->
  <rect
     class="hctrl"
     x="404"
     y="66"
     width="92"
     height="58"
     rx="10"
     id="rect5" />
  <text
     class="hctltx"
     x="450"
     y="92"
     text-anchor="middle"
     id="text5">btvirt</text>
  <text
     class="wtxt"
