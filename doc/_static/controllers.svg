     y="109"
     text-anchor="middle"
     id="text6">emulated</text>
  <!-- air link VM#0 controller <-> btvirt -->
  <line
     class="air"
     x1="250"
     y1="95"
     x2="404"
     y2="95"
     id="line6" />
  <path
     class="wave"
