     text-anchor="middle"
     id="text14">VM HOST #1</text>
  <rect
     class="hctrl"
     x="650"
     y="74"
     width="80"
     height="42"
     rx="8"
     id="rect14" />
  <text
     class="hctltx"
     x="690"
     y="100"
     text-anchor="middle"
     id="text15">hci0</text>
  <rect
     class="chip"
     x="766"
     y="74"
     width="88"
     height="42"
     rx="8"
     id="rect15" />
  <text
     class="chiptx"
     x="810"
     y="100"
