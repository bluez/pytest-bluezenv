     d="M 360 77 A 22 22 0 0 0 360 113"
     id="path9" />
  <text
     class="wtxt"
     x="327"
     y="70"
     text-anchor="middle"
     id="text9">virtual air link</text>
  <!-- air link btvirt <-> VM#1 controller -->
  <line
     class="air"
     x1="496"
